<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Áurea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F1720; --surface:#182234; --surface-2:#202C42; --border:#2C3A54;
    --gold:#C9A24B; --gold-dim:#8A7439; --text:#EFEBE0; --text-dim:#9AA5B8;
    --good:#5FA88C; --bad:#C1613F; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:#05070C; font-family:'IBM Plex Sans',sans-serif; color:var(--text); display:flex; justify-content:center; padding:24px 12px; min-height:100vh;}
  .app-shell{width:100%; max-width:400px; background:var(--ink); border-radius:32px; border:1px solid #263248; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.5); display:flex; flex-direction:column; min-height:820px; position:relative;}
  .statusbar{height:14px;}
  .topbar{padding:6px 16px 0;}
  .topbar-row1{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .brand{font-family:'Fraunces',serif; font-size:19px; font-weight:600;}
  .brand span{color:var(--gold);}
  .lang-switch{display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--gold-dim); border-radius:20px; padding:5px 6px 5px 10px;}
  .lang-switch button{border:none; background:transparent; color:var(--text-dim); font-size:12px; font-weight:600; padding:4px 8px; border-radius:14px; cursor:pointer;}
  .lang-switch button.active{background:var(--gold); color:#1A1300;}
  .screen{flex:1; overflow-y:auto; padding:6px 20px 90px;}
  .screen.hidden{display:none;}
  h1.page-title{font-family:'Fraunces',serif; font-weight:500; font-size:24px; margin:10px 0 4px; line-height:1.15;}
  p.page-sub{color:var(--text-dim); font-size:13px; margin:0 0 18px; line-height:1.5;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px;}
  .row{display:flex; justify-content:space-between; align-items:center;}
  .label{font-size:12.5px; color:var(--text-dim);}
  .value{font-size:14px; font-weight:600;}
  .value.gold{color:var(--gold);} .value.good{color:var(--good);} .value.bad{color:var(--bad);}
  .slider-block{margin:18px 0 6px;} .slider-block .row{margin-bottom:6px;}
  input[type=range]{width:100%; accent-color:var(--gold); height:4px;}
  input[type=text],input[type=email],input[type=password],input[type=number]{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    padding:11px 12px; color:var(--text); font-size:13.5px; margin-bottom:10px; font-family:'IBM Plex Sans';
  }
  .big-result{text-align:center; padding:22px 10px 18px;}
  .big-result .amount{font-family:'Fraunces',serif; font-size:38px; font-weight:600; color:var(--gold);}
  .big-result .amount span{font-size:16px; color:var(--text-dim); font-family:'IBM Plex Sans';}
  .big-result .caption{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .btn-primary{width:100%; background:var(--gold); color:#1A1300; border:none; padding:14px; border-radius:12px; font-weight:700; font-size:14.5px; cursor:pointer; margin-top:6px;}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-secondary{width:100%; background:transparent; color:var(--text); border:1px solid var(--border); padding:12px; border-radius:12px; font-weight:600; font-size:13.5px; cursor:pointer; margin-top:8px;}
  .type-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:14px;}
  .type-card{border:1px solid var(--border); background:var(--surface); border-radius:12px; padding:14px 10px; text-align:center; cursor:pointer;}
  .type-card.selected{border-color:var(--gold); background:rgba(201,162,75,.08);}
  .type-card .ic{font-size:20px; margin-bottom:6px;} .type-card .tn{font-size:12px; font-weight:600;}
  .balance-card{background:linear-gradient(135deg,#1A2540,#101A2E); border:1px solid var(--border); border-radius:18px; padding:20px; margin-bottom:16px;}
  .balance-card .amount{font-family:'Fraunces',serif; font-size:32px; font-weight:600; margin:4px 0 14px;}
  .progress-bg{background:var(--surface-2); height:6px; border-radius:4px; overflow:hidden;}
  .progress-fill{background:var(--gold); height:100%;}
  .section-title{font-size:12px; color:var(--text-dim); margin:18px 0 8px;}
  .payment-row{display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border);}
  .payment-row:last-child{border-bottom:none;}
  .pdate{font-size:13px; font-weight:500;} .pmeta{font-size:11px; color:var(--text-dim);}
  .bottom-nav{position:absolute; bottom:0; left:0; right:0; background:rgba(15,23,32,.92); backdrop-filter:blur(10px); border-top:1px solid var(--border); display:flex; padding:10px 4px 16px;}
  .bottom-nav.hidden{display:none;}
  .nav-item{flex:1; text-align:center; background:none; border:none; color:var(--text-dim); font-size:10px; cursor:pointer; padding:4px 2px;}
  .nav-item .ic{font-size:17px; display:block; margin-bottom:2px;} .nav-item.active{color:var(--gold);}
  .queue-row{display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px; background:var(--surface);}
  .qname{font-size:13px; font-weight:600;} .qmeta{font-size:11px; color:var(--text-dim);}
  .score-tag{font-size:11px; font-weight:700; padding:4px 9px; border-radius:8px; white-space:nowrap;}
  .score-tag.auto{background:rgba(95,168,140,.15); color:var(--good);}
  .score-tag.review{background:rgba(201,162,75,.15); color:var(--gold);}
  .score-tag.reject{background:rgba(193,97,63,.15); color:var(--bad);}
  .note-box{background:rgba(201,162,75,.08); border:1px solid var(--gold-dim); border-radius:10px; padding:11px 13px; font-size:11.5px; color:#E4C97A; line-height:1.5; margin-top:6px;}
  .note-box.warn{background:rgba(193,97,63,.08); border-color:var(--bad); color:#E8A98F;}
  .note-box.error{background:rgba(193,97,63,.12); border-color:var(--bad); color:#F0A98F;}
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .chip{flex:1; min-width:74px; border:1px solid var(--border); border-radius:10px; padding:9px 6px; text-align:center; font-size:11px; cursor:pointer; color:var(--text-dim);}
  .chip.selected{border-color:var(--gold); background:rgba(201,162,75,.08); color:var(--text);}
  .link-btn{background:none; border:none; color:var(--gold); font-size:12.5px; cursor:pointer; text-decoration:underline; padding:0;}
  .kyc-toggle{display:flex; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);}
  .kyc-toggle:last-child{border-bottom:none;}
  .switch{width:40px; height:22px; border-radius:12px; background:var(--surface-2); position:relative; cursor:pointer;}
  .switch.on{background:var(--good);}
  .switch .dot{width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:2px; left:2px; transition:.15s;}
  .switch.on .dot{left:20px;}
</style>
</head>
<body>
<div class="app-shell">
  <div class="statusbar"></div>
  <div class="topbar">
    <div class="topbar-row1">
      <div class="brand">Áurea<span>.</span></div>
      <div class="lang-switch">
        <span>🌐</span>
        <button id="langEs" class="active" onclick="setLang('es')">ES</button>
        <button id="langEn" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>

  <!-- LOGIN / REGISTRO -->
  <div class="screen" id="screen-auth">
    <h1 class="page-title" data-i18n="auth_title">Bienvenido</h1>
    <p class="page-sub" data-i18n="auth_sub">Inicia sesión o crea tu cuenta para solicitar un préstamo.</p>
    <div class="card">
      <input type="text" id="regName" placeholder="Nombre completo" data-i18n-ph="ph_name">
      <input type="email" id="authEmail" placeholder="Email">
      <input
